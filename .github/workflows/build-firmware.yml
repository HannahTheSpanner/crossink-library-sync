name: Build firmware

# Builds every Xteink image this fork targets on each push, so the latest
# commit always has flashable binaries attached as workflow artifacts.
#   default    -> Xteink X3 and X4 (one ESP32-C3 image covers both)
#   x4-classic -> Xteink X4 Classic (X4C)
#   x4-pro     -> Xteink X4 Pro (X4P)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Publishing a release from the GitHub web UI also builds and attaches the images.
  release:
    types: [published]

# Grouped by ref only: a release published in the web UI with a new tag fires
# both a tag push and a release event, and the later run supersedes the first.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  host-tests:
    name: Host tests (OPDS, TLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev

      - name: Configure
        run: cmake -S test -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build OPDS tests
        shell: bash
        run: |
          targets="OpdsParserTest"
          if [ -d test/opds_library_match ]; then targets="$targets OpdsLibraryMatchTest"; fi
          if [ -d test/tls_record_reserve ]; then targets="$targets TlsRecordReserveTest"; fi
          if [ -d test/opds_parser_memory ]; then targets="$targets OpdsParserMemoryTest"; fi
          cmake --build build-tests -j4 --target $targets

      - name: Run OPDS and TLS tests
        run: ctest --test-dir build-tests --output-on-failure -R "Opds|TlsRecordReserve"

  firmware:
    name: Firmware (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
            device: X3 + X4
          - environment: x4-classic
            firmware: firmware-x4-classic
            device: X4 Classic
          - environment: x4-pro
            firmware: firmware-x4-pro
            device: X4 Pro
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build ${{ matrix.environment }}
        shell: bash
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Firmware stats
        shell: bash
        run: |
          {
            echo "## ${{ matrix.device }} (${{ matrix.environment }})"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}.bin
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      # Only attaches the images. Notes come from the release itself (written
      # when it is published in the web UI; .github/release-body.md is the
      # template) or, for a tag pushed with git, from GitHub's generated notes.
      # Passing a body here would overwrite notes written in the UI, because
      # publishing there also fires a tag push.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.bin
          generate_release_notes: ${{ github.event_name != 'release' }}
