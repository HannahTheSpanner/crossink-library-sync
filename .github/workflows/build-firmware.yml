name: Build firmware

# Builds an image for every device CrossInk supports on each push, so the
# latest commit always has flashable binaries attached as workflow artifacts.
#   default    -> Xteink X3 and X4 (one ESP32-C3 image covers both)
#   x4-classic -> Xteink X4 Classic (X4C)
#   x4-pro     -> Xteink X4 Pro (X4P)
#   sticky     -> Seeed reTerminal Sticky
#   picco      -> BOOX Picco (app-slot image; see docs/picco.md)
#   metalio-eink4 -> Metalio E-Ink 4 (plus a full-flash image for USB installs)
#   eego-a4    -> EEGO Reader A4 (plus a full-flash image for USB installs)
# plus the EB Garamond SD font pack for the X3/X4, whose firmware has no room
# for it as a built-in font.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Publishing a release from the GitHub web UI also builds and attaches the images.
  release:
    types: [published]

# Grouped by ref only: a release published in the web UI with a new tag fires
# both a tag push and a release event, and the later run supersedes the first.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  host-tests:
    name: Host tests (OPDS, TLS, downloads, display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev

      - name: Configure
        run: cmake -S test -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build OPDS tests
        shell: bash
        run: |
          targets="OpdsParserTest"
          if [ -d test/opds_library_match ]; then targets="$targets OpdsLibraryMatchTest"; fi
          if [ -d test/opds_sync_queue ]; then targets="$targets OpdsSyncQueueTest"; fi
          if [ -d test/tls_record_reserve ]; then targets="$targets TlsRecordReserveTest"; fi
          if [ -d test/opds_parser_memory ]; then targets="$targets OpdsParserMemoryTest"; fi
          if [ -d test/http_downloader ]; then targets="$targets HttpDownloaderTest HttpDownloaderDevicePathTest"; fi
          cmake --build build-tests -j4 --target $targets

      # Glyph planes and the reader's grayscale passes, including text
      # anti-aliasing on absolute image pages.
      - name: Build display tests
        run: >
          cmake --build build-tests -j4 --target GlyphBitmapTest EpubGrayscaleTest EpubTextGrayscaleTest
          DeferredGrayscaleTest

      # "Opds" also selects the OPDS feed recovery harness, which compiles the
      # browser's real fetchFeed()/addSyncRow() against stubs. Upstream's
      # OpdsServerStoreTest does not link at v2.0.0-rc, so it is not built.
      - name: Run OPDS, TLS and download tests
        run: ctest --test-dir build-tests --output-on-failure -R "Opds|TlsRecordReserve|HttpDownloader" -E "OpdsServerStore"

      - name: Run display tests
        run: >
          ctest --test-dir build-tests --output-on-failure
          -R "GlyphBitmap|EpubGrayscale|EpubTextGrayscale|EpubTextRaster|AbsoluteImageRaster|RetainedGrayscaleOverlay|DeferredGrayscale|ReaderRefreshScope|PageTextDetection|SleepChargeOverlay|DisplaySdkCompatibility"

  firmware:
    name: Firmware (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
            device: X3 + X4
          - environment: x4-classic
            firmware: firmware-x4-classic
            device: X4 Classic
          - environment: x4-pro
            firmware: firmware-x4-pro
            device: X4 Pro
          - environment: sticky
            firmware: firmware-sticky
            device: reTerminal Sticky
          - environment: picco
            firmware: firmware-picco
            device: BOOX Picco
          - environment: metalio-eink4
            firmware: firmware-metalio-eink4
            device: Metalio E-Ink 4
            full_image: true
          - environment: eego-a4
            firmware: firmware-eego-a4
            device: EEGO Reader A4
            full_image: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # Same as upstream's release workflow: custom_sdkconfig runs a nested
      # `pio run` from ~/.platformio/penv, which must use the same core.
      # See https://github.com/pioarduino/platform-espressif32/issues/529
      - name: Pin pioarduino core inside the platform penv
        shell: bash
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.environment }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.environment }}
        shell: bash
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Firmware stats
        shell: bash
        run: |
          {
            echo "## ${{ matrix.device }} (${{ matrix.environment }})"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the full-flash image
        if: matrix.full_image
        run: test -s ".pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-full.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware }}
          path: |
            .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}.bin
            .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-full.bin
          if-no-files-found: error

  sd-font:
    name: SD font (EB Garamond for X3/X4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Same toolchain as upstream's release-fonts workflow.
      - name: Install font tools
        run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install freetype-py fonttools pyyaml

      - name: Build .cpfont pack
        run: |
          python3 lib/EpdFont/scripts/build-sd-fonts.py --config lib/EpdFont/scripts/sd-fonts-fork.yaml \
            --output-dir dist/sd-fonts --clean --verbose -j 1
          mkdir -p dist/release
          cp "dist/sd-fonts/EB Garamond.zip" dist/release/EB-Garamond-SD-font.zip
          unzip -l dist/release/EB-Garamond-SD-font.zip

      - name: Upload SD font
        uses: actions/upload-artifact@v7
        with:
          name: sd-font-eb-garamond
          path: dist/release/EB-Garamond-SD-font.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware, sd-font]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v7
        with:
          pattern: sd-font-*
          merge-multiple: true
          path: dist

      # A tag with "-picco" in its name is a Picco-only release: the other
      # images are still built, as a compile check, but only the Picco's is attached.
      - name: Keep only the Picco image for a Picco-only release
        if: contains(github.ref_name, '-picco')
        run: |
          find dist -type f ! -name 'firmware-picco.bin' -delete
          ls -l dist

      # Only attaches the images. Notes come from the release itself (written
      # when it is published in the web UI; .github/release-body.md is the
      # template) or, for a tag pushed with git, from GitHub's generated notes.
      # Passing a body here would overwrite notes written in the UI, because
      # publishing there also fires a tag push.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.bin
            dist/*.zip
          generate_release_notes: ${{ github.event_name != 'release' }}
